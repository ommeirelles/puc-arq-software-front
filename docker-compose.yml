services:
  soft-arq-front:
    build: .
    container_name: arq-soft-front
    ports:
      - "4173:4173"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host

  soft-arq-cart:
    build: ../puc-arq-soft-api/cart
    deploy:
      replicas: 3
    networks:
      - puc-arq-soft
    environment:
      - PORT=8000
      - SECRET=SECRET
      - PRODUCT_API_URL=https://fakestoreapi.com/
      - AUTH_API_URL=http://soft-arq-auth:8001/
      - DB_URL=postgresql+psycopg://cart:cart@soft-arq-cart-db:5432/cart
      - ENV=$ENV
      - OTEL_SERVICE_NAME=puc-arq-soft-cart
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      - ../puc-arq-soft-api/cart/src:/app/src
    depends_on:
      otel-collector:
        condition: service_started
      soft-arq-cart-db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../puc-arq-soft-api/cart/src
          target: /app/src
        - action: rebuild
          path: ../puc-arq-soft-api/cart/requirements.txt

  soft-arq-auth:
    build: ../puc-arq-soft-api/auth
    deploy:
      replicas: 3
    networks:
      - puc-arq-soft
    environment:
      - PORT=8001
      - SECRET=SECRET
      - DB_URL=postgresql+psycopg://auth:auth@soft-arq-auth-db:5432/auth
      - ENV=$ENV
      - OTEL_SERVICE_NAME=puc-arq-soft-auth
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      - ../puc-arq-soft-api/auth/src:/app/src
    depends_on:
      otel-collector:
        condition: service_started
      soft-arq-auth-db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../puc-arq-soft-api/auth/src
          target: /app/src
        - action: rebuild
          path: ../puc-arq-soft-api/auth/requirements.txt

  soft-arq-lb:
    container_name: arq-soft-lb
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - puc-arq-soft
    depends_on:
      - soft-arq-cart
      - soft-arq-auth

  soft-arq-cart-db:
    container_name: arq-soft-cart-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cart
      - POSTGRES_PASSWORD=cart
      - POSTGRES_DB=cart
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    networks:
      - puc-arq-soft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart -d cart"]
      interval: 5s
      timeout: 3s
      retries: 10

  soft-arq-auth-db:
    container_name: arq-soft-auth-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=auth
      - POSTGRES_PASSWORD=auth
      - POSTGRES_DB=auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - puc-arq-soft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - puc-arq-soft
    depends_on:
      - jaeger

  jaeger:
    container_name: jaeger
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686"
    networks:
      - puc-arq-soft

networks:
  puc-arq-soft:
    name: puc-arq-soft-net

volumes:
  cart-db-data:
  auth-db-data:
