# Single worker: each worker keeps its own round-robin counter, so with
# multiple workers a handful of requests would all land on the first replica.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Log the upstream replica that served each request (round-robin proof).
    log_format upstream_log '$remote_addr "$request" $status -> $upstream_addr';
    access_log /var/log/nginx/access.log upstream_log;

    # Cart API replicas — compose names them <project>-<service>-<n>; listing
    # them explicitly gives nginx true round-robin balancing (the runtime's
    # embedded DNS only hands out one address per query).
    upstream cart_api {
        server puc-arq-software-front-soft-arq-cart-1:8000;
        server puc-arq-software-front-soft-arq-cart-2:8000;
        server puc-arq-software-front-soft-arq-cart-3:8000;
    }

    # Auth API replicas.
    upstream auth_api {
        server puc-arq-software-front-soft-arq-auth-1:8001;
        server puc-arq-software-front-soft-arq-auth-2:8001;
        server puc-arq-software-front-soft-arq-auth-3:8001;
    }

    # Payment API replicas.
    upstream payment_api {
        server puc-arq-software-front-soft-arq-payment-1:8002;
        server puc-arq-software-front-soft-arq-payment-2:8002;
        server puc-arq-software-front-soft-arq-payment-3:8002;
    }

    # Internal routes: any path under /internal/ is service-to-service only
    # (e.g. the payment API closing a cart after an approved payment), so the
    # load balancer never proxies it to the outside — it is only reachable
    # container-to-container inside the docker network.

    # Cart API load balancer — published on the host as :8000.
    server {
        listen 8000;

        location ^~ /internal/ {
            return 404;
        }

        location / {
            proxy_pass http://cart_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Auth API load balancer — published on the host as :8001.
    server {
        listen 8001;

        location ^~ /internal/ {
            return 404;
        }

        location / {
            proxy_pass http://auth_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Payment API load balancer — published on the host as :8002.
    server {
        listen 8002;

        location ^~ /internal/ {
            return 404;
        }

        location / {
            proxy_pass http://payment_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
